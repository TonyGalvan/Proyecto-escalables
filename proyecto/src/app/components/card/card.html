<div class="producto contenedor sombra text-center p-4">

    <h5 class="titulo">
        {{ producto?.nombre }}
    </h5>

    <img [src]="'http://localhost:8080/' + producto?.imagen" class="img-fluid imagen-producto" alt="Pastel">


    <p class="descripcion">
        {{ producto?.descripcion }}
    </p>

    <h4 class="precio">
        ${{ producto?.precio }}
    </h4>

    <div class="d-flex justify-content-center gap-2">
        <button class="btn btn-danger btn-carrito" (click)="agregar()">
            Agregar al carrito
        </button>
        <button class="btn btn-danger" title="Agregar a favoritos" (click)="agregarFavorito()">
            <i class="bi bi-heart"></i>
        </button>
    </div>

</div>
