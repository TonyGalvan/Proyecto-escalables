<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4" style="width: 350px;">

        <h3 class="text-center mb-4">Iniciar Sesión</h3>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="mb-3">
                <label for="username" class="form-label">Nombre de usuario</label>
                <input id="username" type="text" class="form-control" placeholder="Usuario" formControlName="username">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" type="password" class="form-control" placeholder="********" formControlName="password">
            </div>


            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
                Iniciar sesión
            </button>

            <div class="mt-3 text-danger text-center">
                {{ errorMsg() ?? "" }}
            </div>

        </form>

    </div>

</div>
